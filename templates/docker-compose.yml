services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017/app
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT}:5000"
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  mongo_data:
